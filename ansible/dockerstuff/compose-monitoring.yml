services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SERVER_ROOT_URL=https://grafana-fauzan.studentdumbways.my.id
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_PLUGINS_DISABLE=grafana-metricsdrilldown-app

       # SMTP CONFIG
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=fauznpm@gmail.com
      - GF_SMTP_PASSWORD=xrhj uzgx gyvu grvc
      - GF_SMTP_FROM_ADDRESS=fauznpm@gmail.com
      - GF_SMTP_FROM_NAME=Grafana Alert
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

