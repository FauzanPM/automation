---
- name: Configure SSL for Reverse Proxy
  hosts: gateway
  become: yes

  vars:
    domain: fauzan.studentdumbways.my.id
    cert_path: /etc/letsencrypt/live/{{ domain }}
    ip_mon: 15.134.31.72
    ip_app: 3.27.119.102

  tasks:
    - name: Update reverse proxy main app (production) with SSL
      copy:
        dest: /etc/nginx/sites-enabled/app.conf
        content: |
          server {
              listen 80;
              server_name fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_app}}:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy main be (production) with SSL
      copy:
        dest: /etc/nginx/sites-enabled/be.conf
        content: |
          server {
              listen 80;
              server_name api.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name api.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_app}}:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy main app (staging) with SSL
      copy:
        dest: /etc/nginx/sites-enabled/app_stg.conf
        content: |
          server {
              listen 80;
              server_name staging.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name staging.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_app}}:3001;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy main be (staging) with SSL
      copy:
        dest: /etc/nginx/sites-enabled/be_stg.conf
        content: |
          server {
              listen 80;
              server_name staging.api.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name staging.api.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_app}}:5001;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy Jenkins with SSL
      copy:
        dest: /etc/nginx/sites-enabled/Jenkins.conf
        content: |
          server {
              listen 80;
              server_name pipeline.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name pipeline.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_mon}}:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy docker registry with SSL
      copy:
        dest: /etc/nginx/sites-enabled/registry.conf
        content: |
          server {
              listen 80;
              server_name registry.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name registry.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_mon}}:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy node exporter with SSL
      copy:
        dest: /etc/nginx/sites-enabled/node.conf
        content: |
          server {
              listen 80;
              server_name node.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name node.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_mon}}:9100;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy grafana with SSL
      copy:
        dest: /etc/nginx/sites-enabled/grafana.conf
        content: |
          server {
              listen 80;
              server_name grafana.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name grafana.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  proxy_pass http://{{ip_mon}}:3001;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Update reverse proxy prometheus with SSL
      copy:
        dest: /etc/nginx/sites-enabled/prometheus.conf
        content: |
          server {
              listen 80;
              server_name prometheus.fauzan.studentdumbways.my.id;
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name prometheus.fauzan.studentdumbways.my.id;

              ssl_certificate {{ cert_path }}/fullchain.pem;
              ssl_certificate_key {{ cert_path }}/privkey.pem;

              location / {
                  auth_basic "Restricted Prometheus";
                  auth_basic_user_file /etc/nginx/.htpasswd;

                  proxy_pass http://{{ip_mon}}:9090;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Test nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Display nginx test result
      debug:
        msg: "{{ nginx_test.stderr_lines }}"

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
