---
- name: Setup Wildcard Nginx Reverse Proxy (Single File)
  hosts: gateway
  become: yes

  vars:
    ssl_cert_path: /etc/letsencrypt/live/fauzan.studentdumbways.my.id
    app_ip: 103.103.23.208
    monitoring_ip: 16.176.161.101

  tasks:
    - name: Install nginx
      apt:
        update_cache: yes
        name: nginx
        state: present

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Deploy wildcard nginx configuration
      copy:
        dest: /etc/nginx/sites-enabled/wildcard.conf
        content: |
          server {
              listen 80;
              server_name *.fauzan.studentdumbways.my.id;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name *.fauzan.studentdumbways.my.id;

              ssl_certificate     {{ ssl_cert_path }}/fullchain.pem;
              ssl_certificate_key {{ ssl_cert_path }}/privkey.pem;

              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers on;

              set $backend_ip "";
              set $backend_port "";

              # FE Production
              if ($host = "fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ app_ip }}";
                  set $backend_port 3000;
              }

              # FE Staging
              if ($host = "staging.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ app_ip }}";
                  set $backend_port 3001;
              }

              # BE Production
              if ($host = "api.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ app_ip }}";
                  set $backend_port 5000;
              }

              # BE Staging
              if ($host = "staging.api.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ app_ip }}";
                  set $backend_port 5001;
              }

              # Docker Registry
              if ($host = "registry.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ monitoring_ip }}";
                  set $backend_port 5000;
              }

              # Exporter
              if ($host = "node.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ monitoring_ip }}";
                  set $backend_port 9100;
              }

              # Grafana
              if ($host = "grafana.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ monitoring_ip }}";
                  set $backend_port 3001;
              }

              # Prometheus
              if ($host = "prometheus.fauzan.studentdumbways.my.id") {
                  set $backend_ip "{{ monitoring_ip }}";
                  set $backend_port 9090;
              }

              location / {
                  proxy_pass http://$backend_ip:$backend_port;
                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }
          }
      notify: Reload nginx

    - name: Test nginx configuration
      command: nginx -t

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
